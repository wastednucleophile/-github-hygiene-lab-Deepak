[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]
# E/W = pep8, F = pyflakes (unused/undefined), I = import order,
# N = naming conventions, B = bugbears (mutable defaults!), SIM = simplify
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
